name: App bauen (Windows und Mac, portabel)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: never

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests (Rust-Kern)
        run: cargo test -p fotobuch-core
      - name: Kern für die Oberflächentests bauen
        run: cargo build --release -p fotobuch-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testbilder-Generator (nur für die Tests)
        run: python -m pip install pillow numpy pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests (Oberfläche gegen den Rust-Server)
        working-directory: tests/ui
        run: |
          npm ci
          node --test app.test.mjs

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: App bauen
        run: cargo build --release -p fotobuch-assistent -p fotobuch-core
      - name: Selbsttest (App startet und bleibt offen)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./target/release/fotobuch-assistent.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "App ist beim Start beendet worden (Exit-Code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - name: Selbsttest (Server liefert die Oberfläche)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./target/release/fotobuch-dev.exe -ArgumentList "serve","","8766" -PassThru -RedirectStandardOutput dev.log
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8766/
              if ($r.StatusCode -eq 200 -and $r.Content -match "Fotobuch-Assistent") { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Get-Content dev.log; throw "Oberfläche fehlt" }
      - uses: actions/upload-artifact@v4
        with:
          name: fotobuch-assistent-windows
          path: target/release/fotobuch-assistent.exe
          if-no-files-found: error

  macos:
    needs: tests
    runs-on: macos-latest   # Apple Silicon (M1 und neuer)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: App bauen
        run: cargo build --release -p fotobuch-assistent
      - name: App-Paket zusammensetzen (portabel, ohne Installer)
        run: |
          APP="Fotobuch-Assistent.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/fotobuch-assistent "$APP/Contents/MacOS/Fotobuch-Assistent"
          cp crates/app/icons/icon.icns "$APP/Contents/Resources/icon.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Fotobuch-Assistent</string>
            <key>CFBundleDisplayName</key><string>Fotobuch-Assistent</string>
            <key>CFBundleIdentifier</key><string>ch.bbv.fotobuch-assistent</string>
            <key>CFBundleExecutable</key><string>Fotobuch-Assistent</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.2.0</string>
            <key>CFBundleVersion</key><string>0.2.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPhotoLibraryUsageDescription</key><string>Fotos werden nur lokal gelesen.</string>
          </dict></plist>
          PLIST
          chmod +x "$APP/Contents/MacOS/Fotobuch-Assistent"
          codesign --force --deep -s - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Fotobuch-Assistent-mac.zip
      - name: Selbsttest (App startet und bleibt offen)
        run: |
          "Fotobuch-Assistent.app/Contents/MacOS/Fotobuch-Assistent" > app.log 2>&1 &
          PID=$!
          sleep 10
          if ! kill -0 $PID 2>/dev/null; then cat app.log; echo "App ist beim Start beendet worden"; exit 1; fi
          kill $PID || true
      - uses: actions/upload-artifact@v4
        with:
          name: fotobuch-assistent-mac
          path: Fotobuch-Assistent-mac.zip
          if-no-files-found: error
