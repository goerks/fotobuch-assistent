name: App bauen (Windows, Mac und Linux, portabel)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]   # ein Tag wie v0.1.0 veröffentlicht zusätzlich ein Release mit den Downloads

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests (Rust-Kern)
        run: cargo test -p fotobuch-core
      - name: Kern für die Oberflächentests bauen
        run: cargo build --release -p fotobuch-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testbilder-Generator (nur für die Tests)
        run: python -m pip install pillow numpy pytest playwright
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests (Oberfläche gegen den Rust-Server)
        working-directory: tests/ui
        run: |
          npm ci
          node --test app.test.mjs
      - name: Echter Ende-zu-Ende-Test (Demo-Reise im Chromium, Album entsteht)
        env:
          FOTOBUCH_E2E_OUT: ${{ runner.temp }}/album
        run: |
          python -m playwright install --with-deps chromium
          python -m pytest tests/e2e -s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: album-ende-zu-ende
          path: ${{ runner.temp }}/album
          if-no-files-found: ignore

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: App bauen
        run: cargo build --release -p fotobuch-assistent -p fotobuch-core
      - name: Selbsttest (App startet und bleibt offen)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./target/release/fotobuch-assistent.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "App ist beim Start beendet worden (Exit-Code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - name: Selbsttest (Server liefert die Oberfläche)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./target/release/fotobuch-dev.exe -ArgumentList "serve",".","8766" -PassThru -RedirectStandardOutput dev.log
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8766/
              if ($r.StatusCode -eq 200 -and $r.Content -match "Fotobuch-Assistent") { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Get-Content dev.log; throw "Oberfläche fehlt" }
      - uses: actions/upload-artifact@v4
        with:
          name: fotobuch-assistent-windows
          path: target/release/fotobuch-assistent.exe
          if-no-files-found: error

  macos:
    needs: tests
    runs-on: macos-latest   # Apple Silicon (M1 und neuer)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: App bauen
        run: cargo build --release -p fotobuch-assistent
      - name: App-Paket zusammensetzen (portabel, ohne Installer)
        run: |
          APP="Fotobuch-Assistent.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/fotobuch-assistent "$APP/Contents/MacOS/Fotobuch-Assistent"
          cp crates/app/icons/icon.icns "$APP/Contents/Resources/icon.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Fotobuch-Assistent</string>
            <key>CFBundleDisplayName</key><string>Fotobuch-Assistent</string>
            <key>CFBundleIdentifier</key><string>ch.bbv.fotobuch-assistent</string>
            <key>CFBundleExecutable</key><string>Fotobuch-Assistent</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>0.1.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPhotoLibraryUsageDescription</key><string>Fotos werden nur lokal gelesen.</string>
          </dict></plist>
          PLIST
          chmod +x "$APP/Contents/MacOS/Fotobuch-Assistent"
          codesign --force --deep -s - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Fotobuch-Assistent-mac.zip
      - name: Selbsttest (App startet und bleibt offen)
        run: |
          "Fotobuch-Assistent.app/Contents/MacOS/Fotobuch-Assistent" > app.log 2>&1 &
          PID=$!
          sleep 10
          if ! kill -0 $PID 2>/dev/null; then cat app.log; echo "App ist beim Start beendet worden"; exit 1; fi
          kill $PID || true
      - uses: actions/upload-artifact@v4
        with:
          name: fotobuch-assistent-mac
          path: Fotobuch-Assistent-mac.zip
          if-no-files-found: error

  linux:
    needs: tests
    runs-on: ubuntu-22.04   # ältere Systembibliotheken, damit das Programm auf vielen Distributionen läuft
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Systembibliotheken für das Fenster (WebKitGTK) und den Selbsttest
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libxdo-dev libssl-dev xvfb
      - name: App bauen
        run: cargo build --release -p fotobuch-assistent
      - name: Selbsttest (App startet und bleibt offen)
        run: |
          xvfb-run -a ./target/release/fotobuch-assistent > app.log 2>&1 &
          sleep 15
          if ! pgrep -f target/release/fotobuch-assistent > /dev/null; then cat app.log; echo "App ist beim Start beendet worden"; exit 1; fi
          pkill -f target/release/fotobuch-assistent || true
      - name: Paket zusammensetzen (portabel, ohne Installer)
        run: |
          D="Fotobuch-Assistent"
          mkdir -p "$D"
          cp target/release/fotobuch-assistent "$D/fotobuch-assistent"
          cp crates/app/icons/128x128.png "$D/fotobuch-assistent.png"
          cat > "$D/Fotobuch-Assistent.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Fotobuch-Assistent
          Comment=Fotos lokal ordnen, aussortieren und für den Druck vorbereiten
          Exec=./fotobuch-assistent
          Icon=fotobuch-assistent
          Categories=Graphics;Photography;
          Terminal=false
          DESKTOP
          cat > "$D/LIESMICH.txt" <<'TXT'
          Fotobuch-Assistent für Linux (portabel, keine Installation)

          Starten: Doppelklick auf «fotobuch-assistent» oder im Terminal ./fotobuch-assistent
          Falls nötig zuerst ausführbar machen: chmod +x fotobuch-assistent

          Voraussetzung: WebKitGTK 4.1 (auf den meisten Desktop-Systemen vorhanden).
            Debian/Ubuntu: sudo apt install libwebkit2gtk-4.1-0
            Fedora:        sudo dnf install webkit2gtk4.1
            Arch:          sudo pacman -S webkit2gtk-4.1

          Alles läuft lokal. Es werden keine Fotos hochgeladen, deine Originale bleiben unverändert.
          TXT
          chmod +x "$D/fotobuch-assistent"
          tar -czf Fotobuch-Assistent-linux-x86_64.tar.gz "$D"
      - uses: actions/upload-artifact@v4
        with:
          name: fotobuch-assistent-linux
          path: Fotobuch-Assistent-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pakete
      - name: Dateien mit festen Namen bereitstellen (die Webseite verlinkt genau diese Namen)
        run: |
          mkdir -p release
          cp pakete/fotobuch-assistent-windows/fotobuch-assistent.exe release/Fotobuch-Assistent-windows.exe
          cp pakete/fotobuch-assistent-mac/Fotobuch-Assistent-mac.zip release/
          cp pakete/fotobuch-assistent-linux/Fotobuch-Assistent-linux-x86_64.tar.gz release/
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
