[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fotobuch-assistent"
version = "0.1.0"
description = "Lokales, offline arbeitendes Werkzeug zur Vorbereitung von Fotobüchern"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "numpy>=1.26",
    "pillow-heif>=0.16",
]

[project.optional-dependencies]
raw = ["rawpy>=0.21"]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
fotobuch = "fotobuch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fotobuch = ["profiles/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
